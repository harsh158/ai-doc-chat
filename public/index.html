<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Document Chat</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f0f;
        color: #fff;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      header {
        width: 100%;
        padding: 16px 24px;
        background: #111;
        border-bottom: 1px solid #222;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header h1 { font-size: 1.2rem; }
      #upload-area {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #file-input { display: none; }
      #upload-btn {
        padding: 8px 16px;
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.2s;
      }
      #upload-btn:hover { background: #2a2a2a; border-color: #555; }
      #file-status {
        font-size: 0.8rem;
        color: #666;
      }
      #file-status.loaded { color: #22c55e; }
      #chat-container {
        flex: 1;
        width: 100%;
        max-width: 750px;
        overflow-y: auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .message {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 0.95rem;
        line-height: 1.6;
      }
      .user {
        align-self: flex-end;
        background: #2563eb;
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .ai {
        align-self: flex-start;
        background: #1e1e1e;
        color: #e5e5e5;
        border-bottom-left-radius: 4px;
        border: 1px solid #2a2a2a;
      }
      .ai.loading { color: #555; font-style: italic; }
      #input-area {
        width: 100%;
        max-width: 750px;
        padding: 16px;
        display: flex;
        gap: 10px;
      }
      #question-input {
        flex: 1;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid #333;
        background: #1a1a1a;
        color: #fff;
        font-size: 0.95rem;
        outline: none;
      }
      #question-input:focus { border-color: #2563eb; }
      #send-btn {
        padding: 12px 20px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 600;
        transition: background 0.2s;
      }
      #send-btn:hover { background: #1d4ed8; }
      #send-btn:disabled { background: #333; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <header>
      <h1>AI Document Chat</h1>
      <div id="upload-area">
        <span id="file-status">No document loaded</span>
        <button id="upload-btn" onclick="document.getElementById('file-input').click()">
          Upload Document
        </button>
        <input id="file-input" type="file" accept=".txt,.pdf" />
      </div>
    </header>

    <div id="chat-container">
      <div class="message ai">
        Hello! Upload a TXT or PDF document using the button above, then ask me anything about it.
      </div>
    </div>

    <div id="input-area">
      <input
        id="question-input"
        type="text"
        placeholder="Upload a document first, then ask a question..."
        autofocus
      />
      <button id="send-btn">Send</button>
    </div>

    <script>
      // Must be served over HTTP by the Node server (e.g. http://localhost:3000).
      // Opening the HTML file directly (file://) makes fetch("/upload") resolve to file:///C:/upload and fail.
      if (window.location.protocol === "file:") {
        document.body.innerHTML = [
          "<div style='max-width:480px;margin:2rem auto;padding:2rem;text-align:center;font-family:sans-serif;'>",
          "<h2 style='color:#e11;margin-bottom:1rem;'>Open via the server</h2>",
          "<p style='color:#888;line-height:1.6;'>This page was opened from a file (<code>file://</code>). Upload and chat only work when the app is served by the Node server.</p>",
          "<p style='margin:1.5rem 0;'><strong>1.</strong> In a terminal, run: <code style='background:#222;padding:6px 10px;border-radius:6px;'>node server.js</code></p>",
          "<p style='margin:1rem 0;'><strong>2.</strong> In your browser, open: <a href='http://localhost:3000' style='color:#2563eb;'>http://localhost:3000</a></p>",
          "</div>"
        ].join("");
        throw new Error("App must be opened via http://localhost:3000");
      }

      const chatContainer = document.getElementById("chat-container");
      const input = document.getElementById("question-input");
      const sendBtn = document.getElementById("send-btn");
      const fileInput = document.getElementById("file-input");
      const fileStatus = document.getElementById("file-status");

      function addMessage(text, role) {
        const div = document.createElement("div");
        div.classList.add("message", role);
        div.innerHTML = text.replace(/\n/g, "<br/>");
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return div;
      }

      // Handle file upload
      fileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        fileStatus.textContent = "Uploading...";
        fileStatus.className = "";

        const formData = new FormData();
        formData.append("file", file);

        try {
          const res = await fetch("/upload", { method: "POST", body: formData });
          const contentType = res.headers.get("content-type");
          let data;

          if (contentType && contentType.includes("application/json")) {
            data = await res.json();
          } else {
            const text = await res.text();
            if (res.status === 413) {
              addMessage("Upload failed: File too large. Maximum size is 10MB.", "ai");
              fileStatus.textContent = "Upload failed";
              return;
            }
            addMessage("Upload failed: " + (text || res.statusText || "Server error"), "ai");
            fileStatus.textContent = "Upload failed";
            return;
          }

          if (data.success) {
            fileStatus.textContent = `✓ ${file.name} (${data.chunks} chunks)`;
            fileStatus.className = "loaded";
            addMessage(`Document uploaded! Created ${data.chunks} searchable chunks. Ask me anything about it!`, "ai");
            input.placeholder = "Ask a question about your document...";
          } else {
            fileStatus.textContent = "Upload failed";
            addMessage("Upload failed: " + (data.error || "Unknown error"), "ai");
          }
        } catch (err) {
          fileStatus.textContent = "Upload failed";
          addMessage("Upload failed: " + (err.message || "Network error. Check your connection."), "ai");
        }
      });

      async function sendMessage() {
        const question = input.value.trim();
        if (!question) return;

        addMessage(question, "user");
        input.value = "";
        sendBtn.disabled = true;

        const loadingDiv = addMessage("Thinking...", "ai");
        loadingDiv.classList.add("loading");

        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        const data = await response.json();
        loadingDiv.innerHTML = data.answer.replace(/\n/g, "<br/>");
        loadingDiv.classList.remove("loading");
        sendBtn.disabled = false;
        input.focus();
      }

      sendBtn.addEventListener("click", sendMessage);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
      });
    </script>
  </body>
</html>
