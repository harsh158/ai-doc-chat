<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Document Chat</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f0f;
        color: #fff;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      header {
        width: 100%;
        padding: 16px 24px;
        background: #111;
        border-bottom: 1px solid #222;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header h1 { font-size: 1.2rem; }
      #upload-area {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #file-input { display: none; }
      #upload-btn {
        padding: 8px 16px;
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.2s;
      }
      #upload-btn:hover { background: #2a2a2a; border-color: #555; }
      #file-status {
        font-size: 0.8rem;
        color: #666;
      }
      #file-status.loaded { color: #22c55e; }
      #chat-container {
        flex: 1;
        width: 100%;
        max-width: 750px;
        overflow-y: auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .message {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 0.95rem;
        line-height: 1.6;
      }
      .user {
        align-self: flex-end;
        background: #2563eb;
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .ai {
        align-self: flex-start;
        background: #1e1e1e;
        color: #e5e5e5;
        border-bottom-left-radius: 4px;
        border: 1px solid #2a2a2a;
      }
      .ai.loading { color: #555; font-style: italic; }
      #input-area {
        width: 100%;
        max-width: 750px;
        padding: 16px;
        display: flex;
        gap: 10px;
      }
      #question-input {
        flex: 1;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid #333;
        background: #1a1a1a;
        color: #fff;
        font-size: 0.95rem;
        outline: none;
      }
      #question-input:focus { border-color: #2563eb; }
      #send-btn {
        padding: 12px 20px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 600;
        transition: background 0.2s;
      }
      #send-btn:hover { background: #1d4ed8; }
      #send-btn:disabled { background: #333; cursor: not-allowed; }

      #auth-screen {
        width: 100%;
        max-width: 360px;
        padding: 2rem;
        background: #111;
        border: 1px solid #222;
        border-radius: 12px;
        margin: auto;
      }
      #auth-screen h2 { font-size: 1.25rem; margin-bottom: 1.25rem; color: #e5e5e5; }
      #auth-screen .tabs { display: flex; gap: 0; margin-bottom: 1.25rem; }
      #auth-screen .tabs button {
        flex: 1;
        padding: 10px;
        background: #1a1a1a;
        border: 1px solid #333;
        color: #888;
        cursor: pointer;
        font-size: 0.9rem;
      }
      #auth-screen .tabs button:first-child { border-radius: 8px 0 0 0; }
      #auth-screen .tabs button:last-child { border-radius: 0 8px 0 0; }
      #auth-screen .tabs button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
      #auth-screen input {
        width: 100%;
        padding: 12px 14px;
        margin-bottom: 12px;
        border-radius: 8px;
        border: 1px solid #333;
        background: #1a1a1a;
        color: #fff;
        font-size: 0.95rem;
      }
      #auth-screen input:focus { outline: none; border-color: #2563eb; }
      #auth-screen .auth-submit {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 4px;
      }
      #auth-screen .auth-submit:hover { background: #1d4ed8; }
      #auth-screen .auth-error { color: #ef4444; font-size: 0.85rem; margin-top: 8px; }
      #app-screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; }
      #app-screen.visible { display: flex; }
      #user-info { font-size: 0.8rem; color: #666; margin-right: 8px; }
      #logout-btn {
        padding: 6px 12px;
        background: transparent;
        border: 1px solid #444;
        border-radius: 6px;
        color: #888;
        cursor: pointer;
        font-size: 0.8rem;
      }
      #logout-btn:hover { color: #fff; border-color: #666; }
    </style>
  </head>
  <body>
    <div id="auth-screen">
      <h2>Sign in</h2>
      <div class="tabs">
        <button type="button" id="tab-login" class="active">Login</button>
        <button type="button" id="tab-register">Register</button>
      </div>
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Email" required autocomplete="email" />
        <input type="password" id="auth-password" placeholder="Password (min 6 characters)" required minlength="6" autocomplete="current-password" />
        <button type="submit" class="auth-submit" id="auth-submit">Login</button>
        <div id="auth-error" class="auth-error"></div>
      </form>
    </div>

    <div id="app-screen">
    <header>
      <h1>AI Document Chat</h1>
      <div id="upload-area">
        <span id="file-status">No document loaded</span>
        <button id="upload-btn" onclick="document.getElementById('file-input').click()">
          Upload Document
        </button>
        <input id="file-input" type="file" accept=".txt,.pdf" />
        <span id="user-info"></span>
        <button type="button" id="logout-btn">Logout</button>
      </div>
    </header>

    <div id="chat-container">
      <div class="message ai">
        Hello! Upload a TXT or PDF document using the button above, then ask me anything about it.
      </div>
    </div>

    <div id="input-area">
      <input
        id="question-input"
        type="text"
        placeholder="Upload a document first, then ask a question..."
        autofocus
      />
      <button id="send-btn">Send</button>
    </div>
    </div>

    <script>
      if (window.location.protocol === "file:") {
        document.body.innerHTML = [
          "<div style='max-width:480px;margin:2rem auto;padding:2rem;text-align:center;font-family:sans-serif;'>",
          "<h2 style='color:#e11;margin-bottom:1rem;'>Open via the server</h2>",
          "<p style='color:#888;line-height:1.6;'>This page was opened from a file (<code>file://</code>). Upload and chat only work when the app is served by the Node server.</p>",
          "<p style='margin:1.5rem 0;'><strong>1.</strong> In a terminal, run: <code style='background:#222;padding:6px 10px;border-radius:6px;'>node server.js</code></p>",
          "<p style='margin:1rem 0;'><strong>2.</strong> In your browser, open: <a href='http://localhost:3000' style='color:#2563eb;'>http://localhost:3000</a></p>",
          "</div>"
        ].join("");
        throw new Error("App must be opened via http://localhost:3000");
      }

      const authScreen = document.getElementById("auth-screen");
      const appScreen = document.getElementById("app-screen");
      const authForm = document.getElementById("auth-form");
      const authEmail = document.getElementById("auth-email");
      const authPassword = document.getElementById("auth-password");
      const authError = document.getElementById("auth-error");
      const authSubmit = document.getElementById("auth-submit");
      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      const userInfo = document.getElementById("user-info");
      const logoutBtn = document.getElementById("logout-btn");
      const chatContainer = document.getElementById("chat-container");
      const input = document.getElementById("question-input");
      const sendBtn = document.getElementById("send-btn");
      const fileInput = document.getElementById("file-input");
      const fileStatus = document.getElementById("file-status");

      const fetchOpts = (opts = {}) => ({ ...opts, credentials: "include" });

      function showAuthScreen() {
        authScreen.style.display = "block";
        appScreen.classList.remove("visible");
      }
      function showAppScreen(user) {
        authScreen.style.display = "none";
        appScreen.classList.add("visible");
        userInfo.textContent = user ? user.email : "";
      }

      async function checkAuth() {
        try {
          const res = await fetch("/api/auth/me", fetchOpts());
          if (res.ok) {
            const data = await res.json();
            showAppScreen(data.user);
            return;
          }
        } catch (_) {}
        showAuthScreen();
      }

      let isRegister = false;
      tabLogin.addEventListener("click", () => { isRegister = false; tabLogin.classList.add("active"); tabRegister.classList.remove("active"); authSubmit.textContent = "Login"; authError.textContent = ""; });
      tabRegister.addEventListener("click", () => { isRegister = true; tabRegister.classList.add("active"); tabLogin.classList.remove("active"); authSubmit.textContent = "Register"; authError.textContent = ""; });

      authForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        authError.textContent = "";
        const email = authEmail.value.trim();
        const password = authPassword.value;
        if (!email || !password) { authError.textContent = "Email and password required."; return; }
        if (password.length < 6) { authError.textContent = "Password must be at least 6 characters."; return; }
        authSubmit.disabled = true;
        try {
          const url = isRegister ? "/api/auth/register" : "/api/auth/login";
          const res = await fetch(url, fetchOpts({ method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, password }) }));
          const data = await res.json();
          if (data.success) {
            showAppScreen(data.user);
          } else {
            authError.textContent = data.error || "Failed";
          }
        } catch (err) {
          authError.textContent = err.message || "Network error";
        }
        authSubmit.disabled = false;
      });

      logoutBtn.addEventListener("click", async () => {
        await fetch("/api/auth/logout", fetchOpts({ method: "POST" }));
        showAuthScreen();
      });

      checkAuth();

      function addMessage(text, role) {
        const div = document.createElement("div");
        div.classList.add("message", role);
        div.innerHTML = text.replace(/\n/g, "<br/>");
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return div;
      }

      // Handle file upload
      fileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        fileStatus.textContent = "Uploading...";
        fileStatus.className = "";

        const formData = new FormData();
        formData.append("file", file);

        try {
          const res = await fetch("/upload", fetchOpts({ method: "POST", body: formData }));
          const contentType = res.headers.get("content-type");
          let data;

          if (contentType && contentType.includes("application/json")) {
            data = await res.json();
          } else {
            const text = await res.text();
            if (res.status === 401) {
              addMessage("Session expired. Please log in again.", "ai");
              showAuthScreen();
              return;
            }
            if (res.status === 413) {
              addMessage("Upload failed: File too large. Maximum size is 10MB.", "ai");
              fileStatus.textContent = "Upload failed";
              return;
            }
            addMessage("Upload failed: " + (text || res.statusText || "Server error"), "ai");
            fileStatus.textContent = "Upload failed";
            return;
          }
          if (data.success) {
            fileStatus.textContent = `✓ ${file.name} (${data.chunks} chunks)`;
            fileStatus.className = "loaded";
            addMessage(`Document uploaded! Created ${data.chunks} searchable chunks. Ask me anything about it!`, "ai");
            input.placeholder = "Ask a question about your document...";
          } else {
            fileStatus.textContent = "Upload failed";
            addMessage("Upload failed: " + (data.error || "Unknown error"), "ai");
          }
        } catch (err) {
          fileStatus.textContent = "Upload failed";
          addMessage("Upload failed: " + (err.message || "Network error. Check your connection."), "ai");
        }
      });

      async function sendMessage() {
        const question = input.value.trim();
        if (!question) return;

        addMessage(question, "user");
        input.value = "";
        sendBtn.disabled = true;

        const loadingDiv = addMessage("Thinking...", "ai");
        loadingDiv.classList.add("loading");

        const response = await fetch("/ask", fetchOpts({
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        }));

        if (response.status === 401) {
          loadingDiv.innerHTML = "Session expired. Please log in again.";
          showAuthScreen();
          sendBtn.disabled = false;
          return;
        }
        const data = await response.json();
        loadingDiv.innerHTML = data.answer.replace(/\n/g, "<br/>");
        loadingDiv.classList.remove("loading");
        sendBtn.disabled = false;
        input.focus();
      }

      sendBtn.addEventListener("click", sendMessage);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
      });
    </script>
  </body>
</html>
